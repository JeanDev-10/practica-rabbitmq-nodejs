name: poc-rabbitmq

services:
  rabbitmq:
    image: rabbitmq:4-management
    # Hostname fijo: RabbitMQ guarda los datos en una carpeta con el nombre del nodo.
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"   # AMQP (tus programas)
      - "127.0.0.1:15672:15672" # Interfaz web de administración
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Usado desde la lección 11 (outbox e inbox).
  postgres:
    image: postgres:18
    environment:
      # Credenciales de práctica, solo para local.
      POSTGRES_USER: practica
      POSTGRES_PASSWORD: practica
      POSTGRES_DB: practica
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql # ruta desde PostgreSQL 18
    healthcheck:
      # -h obliga a probar por TCP: durante la inicialización solo escucha por socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "practica", "-d", "practica"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  rabbitmq-data:
  postgres-data:
