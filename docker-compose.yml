name: poc-rabbitmq

services:
  rabbitmq:
    image: rabbitmq:4-management
    # Hostname fijo: RabbitMQ guarda los datos en una carpeta con el nombre del nodo.
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"   # AMQP (tus programas)
      - "127.0.0.1:15672:15672" # Interfaz web de administración
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  rabbitmq-data:
